name: Football Lab current UI smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-lab-ui-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install chromium
      - name: Current onboarding, profile, calendar and responsive UI
        run: >
          npx playwright test
          tests/appointment-media-v066.spec.js
          tests/career-manager-v064.spec.js
          tests/calendar-profile.spec.js
          tests/player-profile-v2.spec.js
          tests/database-readonly.spec.js
          tests/world-clock.spec.js
          tests/mobile-home.spec.js
          --config=playwright.ci.config.js
          --workers=2
          --reporter=line
      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: current-ui-smoke-${{ github.run_id }}
          path: |
            test-results/
          retention-days: 3
          if-no-files-found: ignore
