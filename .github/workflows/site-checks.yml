name: Arcade homepage checks
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - '404.html'
      - 'tests/**'
      - '.github/workflows/site-checks.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'styles.css'
      - '404.html'
      - 'tests/**'
      - '.github/workflows/site-checks.yml'
permissions:
  contents: read
jobs:
  homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check homepage archive state and layout
        run: node --test tests/site.test.mjs
