name: The Motor Trade site checks
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'simulator.js'
      - 'trading.js'
      - 'trading.js'
      - 'favicon.svg'
      - '404.html'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/site-checks.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'simulator.js'
      - 'favicon.svg'
      - '404.html'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/site-checks.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check trading engine and simulator JavaScript syntax
        run: node --check trading.js && node --check simulator.js
      - name: Validate career and trading interactions
        run: node --test tests/site.test.mjs
