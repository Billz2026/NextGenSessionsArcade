name: The Motor Trade site checks
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'simulator.js'
      - 'trading.js'
      - 'workshop.js'
      - 'workshop-view.js'
      - 'events.js'
      - 'events-view.js'
      - 'monthly.js'
      - 'monthly-view.js'
      - 'people.js'
      - 'people-view.js'
      - 'vehicle-intel.js'
      - 'vehicle-view.js'
      - 'favicon.svg'
      - '404.html'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/site-checks.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'simulator.js'
      - 'trading.js'
      - 'workshop.js'
      - 'workshop-view.js'
      - 'events.js'
      - 'events-view.js'
      - 'monthly.js'
      - 'monthly-view.js'
      - 'people.js'
      - 'people-view.js'
      - 'vehicle-intel.js'
      - 'vehicle-view.js'
      - 'favicon.svg'
      - '404.html'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/site-checks.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game JavaScript syntax
        run: node --check vehicle-intel.js && node --check vehicle-view.js && node --check people.js && node --check people-view.js && node --check monthly.js && node --check monthly-view.js && node --check events.js && node --check events-view.js && node --check workshop.js && node --check workshop-view.js && node --check trading.js && node --check simulator.js
      - name: Validate full career and trading interactions
        run: node --test tests/site.test.mjs
