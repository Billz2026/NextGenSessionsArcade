name: Playtest beta isolation and browser smoke
on:
  pull_request:
    paths:
      - 'beta/**'
      - 'tests/beta-site-smoke.mjs'
      - 'tests/beta-customer-enquiries.mjs'
      - 'tests/beta-sales-team-activity.mjs'
      - 'tests/beta-market-variety.mjs'
      - 'tests/beta-customer-sales-paths.mjs'
      - 'tests/beta-aftermarket-ui.mjs'
      - '.github/workflows/beta-playtest.yml'
  push:
    branches: [main]
    paths:
      - 'beta/**'
      - 'tests/beta-site-smoke.mjs'
      - 'tests/beta-customer-enquiries.mjs'
      - 'tests/beta-sales-team-activity.mjs'
      - 'tests/beta-market-variety.mjs'
      - 'tests/beta-customer-sales-paths.mjs'
      - '.github/workflows/beta-playtest.yml'
permissions:
  contents: read
jobs:
  beta-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check every beta JavaScript file for syntax errors
        run: |
          for file in beta/*.js tests/beta-*.mjs; do node --check "$file"; done
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Serve live and beta folders side by side
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/nextgen-beta-server.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          curl --fail --silent http://127.0.0.1:4173/beta/ >/dev/null
      - name: Confirm separate live and beta careers and mobile UI
        run: node tests/beta-site-smoke.mjs
      - name: Test genuine buyer enquiries across five active 30-day careers
        run: node tests/beta-customer-enquiries.mjs
      - name: Compare paid sales executive and owner-only contact handling in five active careers
        run: node tests/beta-sales-team-activity.mjs
      - name: Audit 90 days of 2026 petrol diesel hybrid and electric supply with low-mileage stock
        run: node tests/beta-market-variety.mjs
      - name: Check quoted prices, 24-hour viewing, remote refundable deposits and final balance
        run: node tests/beta-customer-sales-paths.mjs
      - name: Playtest auction flash, service booking, save/reload, customer rating and mobile UI
        run: node tests/beta-aftermarket-ui.mjs
      - name: Keep beta browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-site-screenshots
          path: beta-evidence/
          retention-days: 14
          if-no-files-found: ignore
