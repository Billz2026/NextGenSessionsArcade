name: Arcade physics tests
on:
  push:
    paths:
      - 'games/pinball/**'
      - 'tests/pinball-engine.test.mjs'
      - 'tests/pinball-dmd.test.mjs'
      - 'tests/pinball-console.test.mjs'
      - 'tests/pinball-lower-hardware.test.mjs'
      - 'tests/pinball-mid-hardware.test.mjs'
      - 'tests/pinball-upper-hardware.test.mjs'
      - 'games/roulette/engine.mjs'
      - 'tests/roulette-engine.test.mjs'
      - '.github/workflows/arcade-tests.yml'
  pull_request:
    paths:
      - 'games/pinball/**'
      - 'tests/pinball-engine.test.mjs'
      - 'tests/pinball-dmd.test.mjs'
      - 'tests/pinball-console.test.mjs'
      - 'tests/pinball-lower-hardware.test.mjs'
      - 'tests/pinball-mid-hardware.test.mjs'
      - 'tests/pinball-upper-hardware.test.mjs'
      - 'games/roulette/engine.mjs'
      - 'tests/roulette-engine.test.mjs'
      - '.github/workflows/arcade-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate WebGL and Canvas renderer syntax
        run: |
          node --check games/pinball/render3d.mjs
          node --check games/pinball/visuals.mjs
          node --check games/pinball/mid-hardware.mjs
          node --check games/pinball/upper-hardware.mjs
      - name: Run arcade gameplay and display regression tests
        run: node --test tests/roulette-engine.test.mjs tests/pinball-engine.test.mjs tests/pinball-dmd.test.mjs tests/pinball-console.test.mjs tests/pinball-hud.test.mjs tests/pinball-render.test.mjs tests/pinball-lower-hardware.test.mjs tests/pinball-mid-hardware.test.mjs tests/pinball-upper-hardware.test.mjs
